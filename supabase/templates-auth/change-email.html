<!DOCTYPE html>
<html lang="es">
<body style="margin:0;padding:0;background:#f4f4f5;font-family:Arial,Helvetica,sans-serif;color:#18181b;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f4f5;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" style="max-width:560px;background:#ffffff;border:1px solid #e4e4e7;">
          <tr>
            <td style="padding:18px 24px;background:#111317;">
              <img
                src="https://tukuyacademy.edu.pe/img/iconoTukuyAcademy.png"
                alt="Tukuy Academy"
                width="140"
                style="display:block;border:0;max-width:140px;height:auto;"
              />
              <p style="margin:12px 0 0;color:#f5b400;font-size:11px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;">
                Tukuy Academy
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:28px 24px 8px;font-size:22px;font-weight:800;line-height:1.25;">
              Confirma tu nuevo correo
            </td>
          </tr>
          <tr>
            <td style="padding:0 24px 20px;font-size:15px;line-height:1.65;color:#3f3f46;">
              Pediste actualizar el correo de tu cuenta. Confirma el cambio para que quede activo.
            </td>
          </tr>
          <tr>
            <td style="padding:0 24px 28px;">
              <a href="{{ .ConfirmationURL }}"
                style="display:inline-block;background:#0b3a78;color:#ffffff;text-decoration:none;padding:12px 20px;font-weight:700;font-size:14px;">
                Confirmar nuevo correo
              </a>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 24px;border-top:1px solid #e4e4e7;font-size:12px;color:#71717a;">
              Si no fuiste tú, ignora este mensaje.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
